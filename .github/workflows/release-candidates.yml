name: Release Candidates

on:
  pull_request:
  push:
    branches:
      - main
      - 'ai/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-candidates:
    name: Build and smoke release candidates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Derive isolated Android RC identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ -rc\.([0-9]+)$ ]]; then
            echo "VERSION must end in -rc.N for CI release candidates: $version" >&2
            exit 1
          fi
          rc="${BASH_REMATCH[1]}"
          {
            echo "PA_VERSION_NAME=$version"
            echo "PA_VERSION_CODE=$((1000 + rc))"
            echo "PA_APPLICATION_ID=ai.propertyassistant.app.rc${rc}"
            echo "PA_APPLICATION_LABEL=Property Assistant RC${rc}"
          } >> "$GITHUB_ENV"
      - name: Prepare ephemeral Android RC signing key
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pa-signing"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/pa-signing/rc.jks" \
            -storepass rc-password \
            -alias property-assistant-rc \
            -keypass rc-password \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Property Assistant CI RC, OU=Development, O=Property Assistant, C=IN"
      - name: Build signed Android release candidate APK
        env:
          PA_RELEASE_STORE_FILE: ${{ runner.temp }}/pa-signing/rc.jks
          PA_RELEASE_STORE_PASSWORD: rc-password
          PA_RELEASE_KEY_ALIAS: property-assistant-rc
          PA_RELEASE_KEY_PASSWORD: rc-password
        run: |
          chmod +x gradlew
          ./gradlew clean :app:assembleRelease --stacktrace
          test -f android/app/build/outputs/apk/release/app-release.apk
      - name: Verify Android release candidate
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$apksigner"
          test -x "$aapt"
          "$apksigner" verify --verbose "$apk"
          unzip -l "$apk" | grep -q 'assets/index.html'
          if unzip -l "$apk" | grep -Eq 'assets/(voice-core|voice-ui)\.js'; then
            echo "Deferred voice runtime was packaged in the Android candidate" >&2
            exit 1
          fi
          badging="$($aapt dump badging "$apk")"
          grep -Fq "package: name='$PA_APPLICATION_ID'" <<< "$badging"
          grep -Fq "versionCode='$PA_VERSION_CODE'" <<< "$badging"
          grep -Fq "versionName='$PA_VERSION_NAME'" <<< "$badging"
          grep -Fq "application-label:'$PA_APPLICATION_LABEL'" <<< "$badging"
      - name: Build desktop release candidate
        run: python3 scripts/build_desktop_rc.py --out dist
      - name: Smoke desktop packaged candidate
        shell: bash
        run: |
          rc_dir="$(find dist -maxdepth 1 -type d -name 'PropertyAssistant-*-desktop' | head -n1)"
          test -n "$rc_dir"
          python3 "$rc_dir/launcher.py" --smoke
      - name: Verify desktop archive
        shell: bash
        run: |
          archive="$(find dist -maxdepth 1 -type f -name 'PropertyAssistant-*-desktop.zip' | head -n1)"
          test -n "$archive"
          unzip -l "$archive" | grep -q 'web/index.html'
          unzip -l "$archive" | grep -q 'launcher.py'
      - name: Upload Android release candidate
        uses: actions/upload-artifact@v4
        with:
          name: property-assistant-android-rc
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload desktop release candidate
        uses: actions/upload-artifact@v4
        with:
          name: property-assistant-desktop-rc
          path: dist/PropertyAssistant-*-desktop.zip
          if-no-files-found: error
          retention-days: 14
