name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - 'ai/**'
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect repository stacks
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.detect.outputs.node }}
      playwright: ${{ steps.detect.outputs.playwright }}
      android: ${{ steps.detect.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          if [ -f package.json ]; then echo "node=true" >> "$GITHUB_OUTPUT"; else echo "node=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f playwright.config.ts ] || [ -f playwright.config.js ] || [ -f playwright.config.mjs ] || [ -f playwright.config.cjs ]; then echo "playwright=true" >> "$GITHUB_OUTPUT"; else echo "playwright=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f gradlew ]; then echo "android=true" >> "$GITHUB_OUTPUT"; else echo "android=false" >> "$GITHUB_OUTPUT"; fi

  harness:
    name: Harness integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/harness_check.py
      - run: python3 scripts/harness_check.py

  javascript:
    name: JS unit/lint/type checks
    needs: detect
    if: ${{ needs.detect.outputs.node == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present

  playwright:
    name: Playwright E2E
    needs: detect
    if: ${{ needs.detect.outputs.node == 'true' && needs.detect.outputs.playwright == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            p10-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android build and tests
    needs: detect
    if: ${{ needs.detect.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew test --stacktrace
      - name: Android API compatibility lint
        run: ./gradlew lintDebug --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14

  android-ocr-runtime:
    name: Android offline OCR runtime
    needs: detect
    if: ${{ needs.detect.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run bundled OCR against a rendered poster
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

  gate-summary:
    name: Required gate summary
    runs-on: ubuntu-latest
    needs: [detect, harness, javascript, playwright, android, android-ocr-runtime]
    if: always()
    steps:
      - name: Enforce required results
        env:
          DETECT: ${{ needs.detect.result }}
          HARNESS: ${{ needs.harness.result }}
          JAVASCRIPT: ${{ needs.javascript.result }}
          PLAYWRIGHT: ${{ needs.playwright.result }}
          ANDROID: ${{ needs.android.result }}
          ANDROID_OCR_RUNTIME: ${{ needs.android-ocr-runtime.result }}
        run: |
          echo "Detect: $DETECT"
          echo "Harness: $HARNESS"
          echo "JavaScript: $JAVASCRIPT"
          echo "Playwright: $PLAYWRIGHT"
          echo "Android: $ANDROID"
          echo "Android OCR runtime: $ANDROID_OCR_RUNTIME"
          test "$DETECT" = "success"
          test "$HARNESS" = "success"
          for result in "$JAVASCRIPT" "$PLAYWRIGHT" "$ANDROID" "$ANDROID_OCR_RUNTIME"; do
            case "$result" in success|skipped) ;; *) echo "A progressive quality gate failed: $result"; exit 1 ;; esac
          done
