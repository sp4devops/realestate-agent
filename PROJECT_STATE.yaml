known_constraints:
  - Cash build-cost target is zero until product validation/revenue threshold.
  - No paid AI APIs or cloud dependency should be introduced merely for convenience.
  - Normal Android apps must not assume unrestricted cellular-call audio capture/transcription.
  - UI display language must remain independent from voice/input language.
  - P1 desktop is the loopback-served web-compatible shell; packaged desktop release infrastructure is scheduled for P11.
  - P2 uses a versioned repository contract over localStorage as the first shared persistence adapter.
  - P3 deterministic extraction intentionally covers a focused starter vocabulary/locality set; replaceable local models can improve understanding while fallback remains mandatory.
  - P4 STT integration is a replaceable local adapter; production engine weights remain a P10/P11 packaging/benchmark concern.
  - P5 nearby-locality knowledge is a small deterministic starter dictionary, not a claim of complete geographic adjacency.
  - P5 currently treats up to 10 percent above budget as a possible-negotiation preference. No explicit negotiability field exists in the current domain schema, so the matcher must not invent seller negotiability.
  - P5 recalculates/persists matches when match routes render; a repository event/transaction mechanism may replace this trigger if scale later warrants it without changing deterministic ranking rules.

