blockers: []

known_constraints:
  - Cash build-cost target is zero until product validation/revenue threshold.
  - No paid AI APIs or cloud dependency should be introduced merely for convenience.
  - Normal Android apps must not assume unrestricted cellular-call audio capture/transcription.
  - UI display language must remain independent from voice/input language.
  - P1 desktop is the loopback-served web-compatible shell; packaged desktop release infrastructure is scheduled for P11.
  - P2 uses a versioned repository contract over localStorage as the first shared persistence adapter.
  - P3 deterministic extraction intentionally covers a focused starter vocabulary/locality set; replaceable local models can improve understanding while fallback remains mandatory.
  - P4 STT integration is a replaceable local adapter; production engine weights remain a P10/P11 packaging/benchmark concern.
  - P5 nearby-locality knowledge is a small deterministic starter dictionary and P5 does not invent negotiability.
  - P5 persists recalculated matches when match routes render; repository-level event recalculation may replace that trigger later if scale warrants it.
  - P6 deterministic query interpretation intentionally covers a starter real-estate vocabulary/locality/Tamil alias set. Real pilot queries must drive expansion; unsupported phrasing should return no/limited local results rather than fabricated answers.
  - P6 people filtering links buyer/tenant queries to requirements and owner/seller queries to owned properties; role-only lookup does not invent transaction filters.
  - P6 searches persisted matches; match freshness follows the P5 recalculation contract until a repository-level recalculation trigger is introduced.

