known_constraints:
  - Cash build-cost target is zero until product validation/revenue threshold.
  - No paid AI APIs or cloud dependency should be introduced merely for convenience.
  - Normal Android apps must not assume unrestricted cellular-call audio capture/transcription.
  - UI display language must remain independent from voice/input language.
  - P1 desktop is the loopback-served web-compatible shell; packaged desktop release infrastructure is scheduled for P11.
  - P2 uses a versioned repository contract over localStorage as the first shared persistence adapter; a future native database adapter may replace the backend without changing domain schemas when justified.
  - P3 deterministic extraction intentionally covers a focused starter vocabulary/locality set; a replaceable local model adapter can improve understanding later while deterministic fallback remains mandatory.
  - Voice/STT remains owned by P4; deterministic matching remains owned by P5.

