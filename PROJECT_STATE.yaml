blockers: []

known_constraints:
  - Cash build-cost target is zero until product validation/revenue threshold.
  - No paid AI APIs or cloud dependency should be introduced merely for convenience.
  - Normal Android apps must not assume unrestricted cellular-call audio capture/transcription.
  - UI display language must remain independent from voice/input language.
  - P1 desktop is the loopback-served web-compatible shell; packaged desktop release infrastructure is scheduled for P11.
  - Production local STT and OCR engines remain replaceable adapters; concrete runtimes/weights still require packaging and representative-device benchmarking before release/pilot.
  - P5 nearby-locality knowledge and P6 deterministic query vocabulary are intentionally starter sets and should expand from real pilot data.
  - P8 Android avoids broad call-log/call/SMS permissions and uses explicit external communication actions.
  - P9 backup passwords are intentionally unrecoverable and image-heavy encrypted backups can create transient memory pressure.
  - P10 CI browser measurements are regression evidence, not a substitute for approximately 4 GB Android target-device memory/thermal/startup testing.
  - Low-storage/quota exhaustion, process interruption across localStorage/IndexedDB restore, large image-heavy backup behavior and packaged desktop file handling remain target-runtime/release hardening risks for P11.

