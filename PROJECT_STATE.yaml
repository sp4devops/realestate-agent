blockers: []

known_constraints:
  - Cash build-cost target is zero until product validation/revenue threshold.
  - No paid AI APIs or cloud dependency should be introduced merely for convenience.
  - Normal Android apps must not assume unrestricted cellular-call audio capture/transcription.
  - UI display language must remain independent from voice/input language.
  - P1 desktop is the loopback-served web-compatible shell; packaged desktop release infrastructure is scheduled for P11.
  - P4 STT integration is a replaceable local adapter; production engine weights remain a P10/P11 packaging/benchmark concern.
  - P5 nearby-locality knowledge is a small deterministic starter dictionary and P5 does not invent negotiability.
  - P6 deterministic query interpretation intentionally covers a starter vocabulary/locality/Tamil alias set; real pilot queries must drive expansion.
  - P7 OCR integration is a replaceable local adapter; a specific production OCR model/runtime is not yet bundled and must be selected/benchmarked before pilot/release.
  - P8 Android avoids broad call-log/call/SMS permissions and uses ACTION_DIAL plus explicit external communication actions.
  - P9 backup passwords are intentionally unrecoverable; users must retain the password to restore an encrypted backup.
  - P9 backup/export temporarily materializes poster-image bytes into the encrypted payload; very large image-heavy datasets require target-device memory/performance validation in P10.
  - P9 uses browser/WebView file export and import surfaces; packaged desktop-native file handling remains a P11 release concern.

