known_constraints:
  - Cash build-cost target is zero until product validation/revenue threshold.
  - No paid AI APIs or cloud dependency should be introduced merely for convenience.
  - CI Android release candidates use an ephemeral signing key for install/smoke validation; production distribution requires a persistent protected signing key.
  - Android install/launch was not emulator-verified in CI because the current runner gate does not provision an Android emulator; build, signing and APK integrity are verified.
  - Desktop RC intentionally uses a loopback-only Python launcher and system browser; Python 3.9+ is required.
  - Production local STT/OCR runtimes and approximately 4 GB Android target-device memory/thermal benchmarking remain pre-pilot constraints.

