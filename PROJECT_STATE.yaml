known_constraints:
  - Cash build-cost target is zero until product validation/revenue threshold.
  - No paid AI APIs or cloud dependency should be introduced merely for convenience.
  - Normal Android apps must not assume unrestricted cellular-call audio capture/transcription.
  - UI display language must remain independent from voice/input language.
  - P1 desktop is the loopback-served web-compatible shell; packaged desktop release infrastructure is scheduled for P11.
  - P2 uses a versioned repository contract over localStorage as the first shared structured persistence adapter.
  - P3 deterministic extraction intentionally covers a focused starter vocabulary/locality set.
  - P4 STT integration is a replaceable local adapter; production engine weights remain a P10/P11 packaging/benchmark concern.
  - P5 nearby-locality knowledge is a small deterministic starter dictionary and P5 does not invent negotiability.
  - P6 deterministic query interpretation intentionally covers a starter real-estate vocabulary/locality/Tamil alias set; real pilot queries must drive expansion.
  - P7 stores original poster image Blobs in local IndexedDB and only an opaque imageRef in the structured domain store to avoid localStorage quota failure.
  - P7 Android camera capture uses an external camera intent plus app-private FileProvider cache URI; no CAMERA permission or Internet permission is requested.
  - P7 location capture is optional ACCESS_COARSE_LOCATION requested through the WebView only when the Property Advisor taps the one-shot location action; no fine or continuous location tracking exists.
  - P7 OCR integration is a replaceable local adapter; a specific production OCR model/runtime is not yet bundled and must be selected/benchmarked before pilot/release.

