blockers:
  - Physical Android validation of the 0.11.0-rc.5 English typing-only candidate is required before P12 is called pilot-ready or merge-ready.

known_constraints:
  - Cash build-cost target is zero until product validation/revenue threshold.
  - No paid AI APIs or cloud dependency should be introduced merely for convenience.
  - CI Android RC uses an ephemeral signing key; production distribution requires a persistent protected signing key.
  - Desktop RC requires Python 3.9+ and uses a loopback-only system-browser launcher.
  - Bundled OCR is automated on an emulator; approximately 4 GB Android physical-device accuracy, memory, latency and thermal benchmarking remain required.
  - Product-mode capability flags describe this compiled pilot; packaging/runtime activation must be wired when deferred adapters return.
  - Direct Call/WhatsApp actions from Ask/person cards are a later enhancement; current Match and Follow-up screens provide the operational actions.

