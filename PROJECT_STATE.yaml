known_constraints:
  - Cash build-cost target is zero until product validation/revenue threshold.
  - No paid AI APIs or cloud dependency should be introduced merely for convenience.
  - CI Android RC uses an ephemeral signing key; production distribution requires a persistent protected signing key.
  - Desktop RC requires Python 3.9+ and uses a loopback-only system-browser launcher.
  - Production local STT/OCR runtimes and approximately 4 GB Android physical-device benchmarking remain broader-release constraints.
  - P12 makes the approximately five-Property-Advisor pilot operationally runnable but cannot substitute for real pilot feedback.

