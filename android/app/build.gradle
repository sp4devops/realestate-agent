plugins { id 'com.android.application' }

def versionFile = rootProject.file('../VERSION')
def releaseVersionName = versionFile.exists() ? versionFile.text.trim() : '0.11.0-rc.5'
def releaseVersionCode = (System.getenv('PA_VERSION_CODE') ?: '15') as Integer
def applicationIdValue = System.getenv('PA_APPLICATION_ID') ?: 'ai.propertyassistant.app'
def applicationLabel = System.getenv('PA_APPLICATION_LABEL') ?: 'Property Assistant'

def releaseStore = System.getenv('PA_RELEASE_STORE_FILE') ?: (project.findProperty('paReleaseStoreFile') ?: '')
def releaseStorePassword = System.getenv('PA_RELEASE_STORE_PASSWORD') ?: (project.findProperty('paReleaseStorePassword') ?: '')
def releaseKeyAlias = System.getenv('PA_RELEASE_KEY_ALIAS') ?: (project.findProperty('paReleaseKeyAlias') ?: '')
def releaseKeyPassword = System.getenv('PA_RELEASE_KEY_PASSWORD') ?: (project.findProperty('paReleaseKeyPassword') ?: '')
def hasReleaseSigning = [releaseStore, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.toString().isBlank() }

android {
  namespace 'ai.propertyassistant.app'
  compileSdk 35
  defaultConfig {
    applicationId applicationIdValue
    minSdk 24
    targetSdk 35
    versionCode releaseVersionCode
    versionName releaseVersionName
    resValue 'string', 'app_name', applicationLabel
    resValue 'string', 'app_version_label', releaseVersionName
  }

  signingConfigs {
    release {
      if (hasReleaseSigning) {
        storeFile file(releaseStore)
        storePassword releaseStorePassword
        keyAlias releaseKeyAlias
        keyPassword releaseKeyPassword
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      if (hasReleaseSigning) signingConfig signingConfigs.release
    }
  }
}

dependencies {
  // Align Kotlin artifacts pulled transitively by AndroidX and ML Kit to avoid duplicate JDK7/JDK8 classes.
  implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
  implementation 'androidx.core:core:1.15.0'
  implementation 'androidx.webkit:webkit:1.12.1'
  // Bundled Latin-script model: available offline immediately, with no model download or Internet permission.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}

tasks.register('syncWebAssets', Sync) {
  from(rootProject.file('../web')) {
    exclude 'voice-core.js', 'voice-ui.js'
  }
  into project.file('src/main/assets')
}
preBuild.dependsOn syncWebAssets
